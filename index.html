/* ============ MESURE D'AUDIENCE (Google Apps Script) ============
   Remplace la valeur ci-dessous par l'URL de déploiement de ton script
   (voir guide de déploiement). Tant qu'elle n'est pas remplacée,
   l'app fonctionne normalement, sans mesure. */
const TRACK_URL = "COLLE_ICI_L_URL_DEPLOIEMENT_APPS_SCRIPT";

function track(event, module) {
  if (!TRACK_URL || TRACK_URL.indexOf("COLLE_ICI") === 0) return;
  try {
    let u = TRACK_URL + "?e=" + encodeURIComponent(event);
    if (module) u += "&m=" + encodeURIComponent(module);
    if (document.referrer) u += "&r=" + encodeURIComponent(document.referrer);
    fetch(u, { mode: "no-cors" });
  } catch (err) {}
}
</script>

function shuffle(arr) {
  const r = [...arr];
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

function useProgress() {
  const [scores, setScores] = useState({});
  useEffect(() => {
    try {
      const raw = window.localStorage.getItem("contraction-progress");
      if (raw) setScores(JSON.parse(raw));
    } catch (e) {}
  }, []);
  const save = (key, value) => {
    setScores((prev) => {
      const next = { ...prev, [key]: value };
      try { window.localStorage.setItem("contraction-progress", JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };
  const reset = () => {
    setScores({});
    try { window.localStorage.removeItem("contraction-progress"); } catch (e) {}
  };
  return { scores, save, reset };
}

/* ============ DESIGN SYSTEM (premium) ============ */
const OKS  = { background: "rgba(5,150,105,0.10)",  borderColor: "rgba(5,150,105,0.45)" };
const BADS = { background: "rgba(225,29,72,0.08)", borderColor: "rgba(225,29,72,0.40)" };
const WARNS = { background: "rgba(217,119,6,0.12)" };

function Ring({ value, size = 56, stroke = 5, color }) {
  const v = Math.min(100, Math.max(0, value));
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <div className="relative shrink-0" style={{ width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeOpacity="0.15" strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c - (v / 100) * c}
          style={{ transition: "stroke-dashoffset 0.7s cubic-bezier(0.22,1,0.36,1)" }} />
      </svg>
      <div className="absolute inset-0 grid place-items-center">
        <span className="text-[11px] font-bold tabular-nums" style={{ color }}>{v}%</span>
      </div>
    </div>
  );
}

function Card({ children, className = "p-7" }) {
  return <div className={`rounded-2xl border ${T.line} ${T.card} ${T.shadow} ${className}`}>{children}</div>;
}

function Eyebrow({ children }) {
  return <p className={`text-[11px] font-bold uppercase tracking-[0.16em] ${T.faint}`}>{children}</p>;
}

function Button({ children, onClick, tone = "primary", accent, className = "", disabled }) {
  const primary = tone === "primary";
  return (
    <button onClick={onClick} disabled={disabled}
      className={`px-5 py-2.5 rounded-full text-sm font-semibold transition-all active:scale-[0.97] disabled:opacity-40 border ${primary ? "border-transparent" : `${T.line} ${T.soft} ${T.ink} hover:opacity-75`} ${className}`}
      style={primary ? { background: accent || T.hex, color: accent ? T.onAccent : T.onHex } : undefined}>
      {children}
    </button>
  );
}

function ModHead({ accent, left, right }) {
  return (
    <div className="flex items-center justify-between mb-5">
      <Eyebrow>{left}</Eyebrow>
      <span className="text-xs font-bold tabular-nums px-2.5 py-1 rounded-full" style={{ background: accent + "1F", color: accent }}>{right}</span>
    </div>
  );
}

function Tabs({ view, setView }) {
  const items = [
    { key: "home", label: "Réviser", icon: "✦", hex: T.hex, fg: T.onHex },
    { key: "flash", label: "Flashcards", icon: "🃏", hex: ACCENTS.flash.hex, fg: T.onAccent },
    { key: "quiz", label: "Quiz", icon: "🎯", hex: ACCENTS.quiz.hex, fg: T.onAccent },
    { key: "vf", label: "Vrai / Faux", icon: "⚖️", hex: ACCENTS.vf.hex, fg: T.onAccent },
    { key: "count", label: "Comptage", icon: "🔢", hex: ACCENTS.count.hex, fg: T.onAccent },
    { key: "texte", label: "Analyser", icon: "📄", hex: ACCENTS.texte.hex, fg: T.onAccent },
  ];
  return (
    <div className={`flex flex-wrap gap-1 p-1 rounded-full border ${T.line} ${T.soft} mb-8`}>
      {items.map((it) => {
        const active = view === it.key;
        return (
          <button key={it.key} onClick={() => setView(it.key)}
            className={`px-4 py-2.5 rounded-full text-sm font-semibold transition-all ${active ? "" : `${T.sub} hover:opacity-70`}`}
            style={active ? { background: it.hex, color: it.fg } : undefined}>
            <span className="mr-1.5">{it.icon}</span>{it.label}
          </button>
        );
      })}
    </div>
  );
}

/* ---- Flashcards ---- */
function Flashcards({ onScore }) {
  const [order, setOrder] = useState(() => shuffle(FLASHCARDS.map((_, i) => i)));
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState([]);
  const [again, setAgain] = useState([]);
  const [done, setDone] = useState(false);
  const accent = ACCENTS.flash.hex;
  const card = FLASHCARDS[order[idx]];

  const judge = (ok) => {
    const nk = ok ? [...known, order[idx]] : known;
    const na = ok ? again : [...again, order[idx]];
    setKnown(nk); setAgain(na); setFlipped(false);
    if (idx + 1 >= order.length) { onScore("flash", Math.round((nk.length / order.length) * 100)); setDone(true); }
    else setIdx(idx + 1);
  };
  const restart = (onlyAgain) => {
    const pool = onlyAgain && again.length > 0 ? again : shuffle(FLASHCARDS.map((_, i) => i));
    setOrder(pool); setIdx(0); setKnown([]); setAgain([]); setDone(false); setFlipped(false);
  };

  if (done) {
    const total = known.length + again.length || 1;
    const pct = Math.round((known.length / total) * 100);
    return (
      <Card>
        <Eyebrow>Bilan de la série</Eyebrow>
        <div className="flex items-center gap-6 mt-4 mb-5">
          <Ring value={pct} size={72} color={accent} />
          <div>
            <p className={`text-lg font-bold ${T.ink}`}>✅ {known.length} maîtrisées · 🔁 {again.length} à revoir</p>
            {again.length > 0 && (
              <p className={`text-sm ${T.sub} mt-1`}>À rejouer en priorité : {again.map((i) => FLASHCARDS[i].tag).filter((x, k, arr) => arr.indexOf(x) === k).join(", ")}</p>
            )}
          </div>
        </div>
        <div className="flex gap-3 flex-wrap">
          {again.length > 0 && <Button accent={accent} onClick={() => restart(true)}>Rejouer les cartes à revoir</Button>}
          <Button tone="ghost" onClick={() => restart(false)}>Rejouer toutes les cartes</Button>
        </div>
      </Card>
    );
  }

  return (
    <Card>
      <ModHead accent={accent} left={card.tag} right={`${idx + 1} / ${order.length}`} />
      <button onClick={() => setFlipped(!flipped)}
        className={`w-full min-h-56 rounded-2xl border-2 ${T.line} ${T.card} p-8 flex items-center justify-center text-center transition-all active:scale-[0.99]`}
        style={{ borderColor: flipped ? accent : undefined }}>
        {!flipped
          ? <p className={`text-xl font-semibold leading-snug ${T.ink}`}>{card.q}</p>
          : <p className={`text-[15px] leading-relaxed ${T.sub}`}>{card.a}</p>}
      </button>
      <p className={`text-xs font-semibold text-center mt-3 ${T.faint}`}>{flipped ? "Clique pour revoir la question" : "Réfléchis… puis clique pour vérifier"}</p>
      {flipped && (
        <div className="flex gap-3 mt-5">
          <Button tone="ghost" className="flex-1" onClick={() => judge(true)}>✅ Je savais</Button>
          <Button accent={accent} className="flex-1" onClick={() => judge(false)}>🔁 À revoir</Button>
        </div>
      )}
    </Card>
  );
}

/* ---- Quiz ---- */
function Quiz({ onScore }) {
  const [order, setOrder] = useState(() => shuffle(QUIZ.map((_, k) => k)));
  const [i, setI] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const accent = ACCENTS.quiz.hex;
  const q = QUIZ[order[i]];

  const pick = (k) => { if (picked === null) { setPicked(k); if (k === q.correct) setScore(score + 1); } };
  const next = () => {
    if (i + 1 >= order.length) { onScore("quiz", Math.round((score / order.length) * 100)); setDone(true); }
    else { setI(i + 1); setPicked(null); }
  };

  if (done) {
    const pct = Math.round((score / order.length) * 100);
    return (
      <Card>
        <Eyebrow>Résultat du quiz</Eyebrow>
        <div className="flex items-center gap-6 mt-4 mb-5">
          <Ring value={pct} size={72} color={accent} />
          <div>
            <p className={`text-2xl font-bold ${T.ink}`}>{score} / {order.length}</p>
            <p className={`text-sm ${T.sub} mt-1`}>{pct >= 80 ? "Excellent ! Tu es prêt(e) pour les règles du jeu. 🎉" : pct >= 50 ? "Bonne base — rejoue pour verrouiller les pièges. 💪" : "Reprends les flashcards puis reviens : c'est en se trompant qu'on apprend. 🌱"}</p>
          </div>
        </div>
        <Button accent={accent} onClick={() => { setOrder(shuffle(QUIZ.map((_, k) => k))); setI(0); setPicked(null); setScore(0); setDone(false); }}>Rejouer le quiz</Button>
      </Card>
    );
  }

  return (
    <Card>
      <ModHead accent={accent} left="Choix multiple" right={`${i + 1} / ${order.length}`} />
      <p className={`text-lg font-semibold leading-snug ${T.ink} mb-5`}>{q.q}</p>
      <div className="space-y-2.5">
        {q.choices.map((c, k) => {
          let style;
          if (picked !== null) style = k === q.correct ? OKS : (k === picked ? BADS : { opacity: 0.45 });
          return (
            <button key={k} onClick={() => pick(k)} disabled={picked !== null}
              className={`w-full text-left px-4 py-3.5 rounded-xl border ${T.line} ${T.card} flex items-start gap-3 text-sm transition-all ${picked === null ? "hover:-translate-y-px" : ""}`}
              style={style}>
              <span className={`w-6 h-6 rounded-full grid place-items-center text-[11px] font-bold shrink-0 ${T.ink}`}
                style={{ background: picked === null ? undefined : (k === q.correct ? "rgba(5,150,105,0.16)" : k === picked ? "rgba(225,29,72,0.14)" : undefined) }}>
                {String.fromCharCode(65 + k)}
              </span>
              <span className={T.ink}>{c}</span>
            </button>
          );
        })}
      </div>
      {picked !== null && (
        <div className="mt-5 rounded-xl border p-4 text-sm" style={picked === q.correct ? OKS : BADS}>
          <b className={T.ink}>{picked === q.correct ? "✅ Exact. " : "❌ Pas tout à fait. "}</b>
          <span className={T.sub}>{q.why}</span>
          <div className="mt-3"><Button accent={accent} onClick={next}>{i + 1 >= order.length ? "Voir mon résultat" : "Question suivante →"}</Button></div>
        </div>
      )}
    </Card>
  );
}

/* ---- Vrai / Faux ---- */
function VraiFaux({ onScore }) {
  const [order, setOrder] = useState(() => shuffle(VRAIFAUX.map((_, k) => k)));
  const [i, setI] = useState(0);
  const [answered, setAnswered] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const accent = ACCENTS.vf.hex;
  const s = VRAIFAUX[order[i]];

  const answer = (v) => { if (answered === null) { setAnswered(v); if (v === s.v) setScore(score + 1); } };
  const next = () => {
    if (i + 1 >= order.length) { onScore("vf", Math.round((score / order.length) * 100)); setDone(true); }
    else { setI(i + 1); setAnswered(null); }
  };

  if (done) {
    const pct = Math.round((score / order.length) * 100);
    return (
      <Card>
        <Eyebrow>Résultat Vrai / Faux</Eyebrow>
        <div className="flex items-center gap-6 mt-4 mb-5">
          <Ring value={pct} size={72} color={accent} />
          <div>
            <p className={`text-2xl font-bold ${T.ink}`}>{score} / {order.length}</p>
            <p className={`text-sm ${T.sub} mt-1`}>{pct >= 80 ? "Les règles du jeu n'ont plus de secret pour toi. ✨" : "Relis la fiche « Règles du jeu » de la méthodo, puis rejoue. 📘"}</p>
          </div>
        </div>
        <Button accent={accent} onClick={() => { setOrder(shuffle(VRAIFAUX.map((_, k) => k))); setI(0); setAnswered(null); setScore(0); setDone(false); }}>Rejouer</Button>
      </Card>
    );
  }

  return (
    <Card>
      <ModHead accent={accent} left="Règles du jeu" right={`${i + 1} / ${order.length}`} />
      <p className={`text-lg font-semibold leading-snug ${T.ink} mb-6`}>{s.s}</p>
      <div className="flex gap-3">
        {[true, false].map((v) => {
          const isPicked = answered === v;
          const good = v === s.v;
          let style;
          if (answered !== null) style = isPicked ? (good ? OKS : BADS) : { opacity: 0.4 };
          return (
            <button key={String(v)} onClick={() => answer(v)} disabled={answered !== null}
              className={`flex-1 py-3.5 rounded-xl border font-bold text-sm transition-all ${T.line} ${T.card} ${T.ink} ${answered === null ? "hover:-translate-y-px" : ""}`}
              style={style}>
              {v ? "VRAI" : "FAUX"}
            </button>
          );
        })}
      </div>
      {answered !== null && (
        <div className="mt-5 rounded-xl border p-4 text-sm" style={answered === s.v ? OKS : BADS}>
          <b className={T.ink}>{answered === s.v ? "✅ Bien vu. " : "❌ Raté… "}</b>
          <span className={T.sub}>{s.why}</span>
          <div className="mt-3"><Button accent={accent} onClick={next}>{i + 1 >= order.length ? "Voir mon résultat" : "Suivante →"}</Button></div>
        </div>
      )}
    </Card>
  );
}

/* ---- Comptage ---- */
function Comptage({ onScore }) {
  const [order, setOrder] = useState(() => shuffle(COMPTAGE.map((_, i) => i)));
  const [i, setI] = useState(0);
  const [val, setVal] = useState("");
  const [checked, setChecked] = useState(false);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const accent = ACCENTS.count.hex;
  const item = COMPTAGE[order[i]];

  const check = () => { setChecked(true); if (parseInt(val, 10) === item.n) setScore(score + 1); };
  const next = () => {
    if (i + 1 >= order.length) { onScore("count", Math.round((score / order.length) * 100)); setDone(true); }
    else { setI(i + 1); setVal(""); setChecked(false); }
  };

  if (done) {
    const pct = Math.round((score / order.length) * 100);
    return (
      <Card>
        <Eyebrow>Résultat du comptage</Eyebrow>
        <div className="flex items-center gap-6 mt-4 mb-5">
          <Ring value={pct} size={72} color={accent} />
          <p className={`text-sm ${T.sub}`}>Règle d'or : tout mot compte, séparé par un blanc ou un signe typographique — sauf le « t » euphonique.</p>
        </div>
        <Button accent={accent} onClick={() => { setOrder(shuffle(COMPTAGE.map((_, k) => k))); setI(0); setVal(""); setChecked(false); setScore(0); setDone(false); }}>Rejouer</Button>
      </Card>
    );
  }

  return (
    <Card>
      <ModHead accent={accent} left="Combien de mots ?" right={`${i + 1} / ${order.length}`} />
      <div className={`rounded-2xl ${T.soft} p-8 text-center mb-5`}>
        <p className={`text-3xl font-bold tracking-tight ${T.ink}`}>« {item.expr} »</p>
      </div>
      {!checked ? (
        <div className="flex gap-3">
          <input type="number" min="0" value={val} onChange={(e) => setVal(e.target.value)} placeholder="Nombre de mots"
            className={`flex-1 px-4 py-2.5 rounded-full border ${T.line} ${T.card} ${T.ink} outline-none text-sm`}
            onKeyDown={(e) => { if (e.key === "Enter" && val !== "") check(); }} />
          <Button accent={accent} onClick={check} disabled={val === ""}>Vérifier</Button>
        </div>
      ) : (
        <div className="rounded-xl border p-4" style={parseInt(val, 10) === item.n ? OKS : BADS}>
          <p className={`font-bold ${T.ink}`}>{parseInt(val, 10) === item.n ? `✅ Oui : ${item.n} mot(s) !` : `❌ Non : la bonne réponse est ${item.n}.`}</p>
          <p className={`text-sm ${T.sub} mt-1`}>{item.why}</p>
          <div className="mt-3"><Button accent={accent} onClick={next}>{i + 1 >= order.length ? "Voir mon résultat" : "Suivant →"}</Button></div>
        </div>
      )}
      <p className={`text-xs mt-4 ${T.faint}`}>💡 Au DS, tu ne comptes qu'à la fin, après ta première reformulation au brouillon.</p>
    </Card>
  );
}


/* ---- Module d'analyse de textes ---- */
function Textes({ onScore }) {
  const [order, setOrder] = useState(() => shuffle(TEXTES.map((_, k) => k)));
  const [i, setI] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [judged, setJudged] = useState(null);
  const [known, setKnown] = useState(0);
  const [done, setDone] = useState(false);
  const accent = ACCENTS.texte.hex;
  const t = TEXTES[order[i]];

  const judge = (ok) => {
    setJudged(ok);
    const nk = known + (ok ? 1 : 0);
    setKnown(nk);
    if (i + 1 >= order.length) { onScore("texte", Math.round((nk / order.length) * 100)); setDone(true); }
  };
  const next = () => { setI(i + 1); setRevealed(false); setJudged(null); };
  const restart = () => {
    setOrder(shuffle(TEXTES.map((_, k) => k)));
    setI(0); setRevealed(false); setJudged(null); setKnown(0); setDone(false);
  };

  if (done) {
    const pct = Math.round((known / order.length) * 100);
    return (
      <Card>
        <Eyebrow>Bilan de l'analyse de textes</Eyebrow>
        <div className="flex items-center gap-6 mt-4 mb-5">
          <Ring value={pct} size={72} color={accent} />
          <p className={`text-lg font-bold ${T.ink}`}>✅ {known} textes analysés · 🔁 {order.length - known} à revoir</p>
        </div>
        <Button accent={accent} onClick={restart}>Rejouer les textes</Button>
      </Card>
    );
  }

  return (
    <Card>
      <ModHead accent={accent} left={t.focus} right={`${i + 1} / ${order.length}`} />
      <p className={`text-sm font-bold ${T.ink} mb-3`}>{t.auteur} <span className="font-normal italic">— {t.oeuvre}</span></p>
      <blockquote className={`rounded-2xl border ${T.line} ${T.soft} p-5 text-[15px] leading-relaxed italic ${T.ink} mb-4`}>
        {t.texte}
      </blockquote>
      <div className="rounded-xl border p-4 text-sm" style={{ borderColor: accent + "55", background: accent + "12" }}>
        <b className={T.ink}>🎯 Ta mission (au brouillon !)</b>
        <p className={`${T.sub} mt-1`}>{t.consigne}</p>
      </div>
      {!revealed ? (
        <div className="mt-5"><Button accent={accent} onClick={() => setRevealed(true)}>J'ai cherché au brouillon → voir la réponse</Button></div>
      ) : (
        <div className="mt-5">
          <div className="rounded-xl border p-4 text-sm" style={OKS}>
            <b className={T.ink}>Correction</b>
            <div className="space-y-2 mt-2">
              {t.reponse.map((r, k) => <p key={k} className={`${T.sub} leading-relaxed`}>• {r}</p>)}
            </div>
            <p className={`italic pt-3 mt-3 border-t ${T.line} ${T.sub}`}>💡 {t.tip}</p>
          </div>
          {judged === null ? (
            <div className="flex gap-3 mt-5">
              <Button tone="ghost" className="flex-1" onClick={() => judge(true)}>✅ J'avais trouvé l'essentiel</Button>
              <Button accent={accent} className="flex-1" onClick={() => judge(false)}>🔁 À revoir</Button>
            </div>
          ) : (
            <div className="mt-5">
              <Button accent={accent} onClick={next}>{i + 1 >= order.length ? "Voir mon bilan" : "Texte suivant →"}</Button>
            </div>
          )}
        </div>
      )}
    </Card>
  );
}

/* ============ APP (Design Editorial) ============ */
function App() {
  const { scores, save, reset } = useProgress();
  const [view, setView] = useState("home");

  const progress = useMemo(() => {
    const keys = Object.keys(ACCENTS);
    const vals = keys.map((k) => scores[k] ?? 0);
    return Math.round(vals.reduce((a, b) => a + b, 0) / keys.length);
  }, [scores]);

  const best = (k, v) => save(k, Math.max(v, scores[k] ?? 0));
  const go = (k) => {
    setView(k);
    if (k !== "home") track("module", k);
    try { window.scrollTo({ top: 0 }); } catch (e) {}
  };

  useEffect(() => {
    try {
      if (!window.sessionStorage.getItem("contraction-visited")) {
        window.sessionStorage.setItem("contraction-visited", "1");
        track("ouverture");
      }
    } catch (e) { track("ouverture"); }
  }, []);

  return (
    <div className={`min-h-screen ${T.page} ${T.font}`}>
      <div className="max-w-2xl mx-auto px-5 py-10 md:py-14">
        <header className="flex items-start justify-between gap-6 mb-9">
          <div>
            <Eyebrow>1ʳᵉ ST2S3 · Français</Eyebrow>
            <h1 className={`text-[26px] md:text-3xl font-bold tracking-tight ${T.ink} mt-2 leading-tight`}>
              Réviser la contraction<br className="hidden md:block" /> de texte
            </h1>
          </div>
          <div className="flex flex-col items-center gap-1.5 pt-1">
            <Ring value={progress} color={T.hex} />
            <span className={`text-[11px] font-semibold ${T.faint}`}>progression</span>
          </div>
        </header>
        <Tabs view={view} setView={go} />
        {view === "home" && <Home scores={scores} go={go} reset={reset} />}
        {view === "flash" && <Flashcards onScore={(k, v) => best(k, v)} />}
        {view === "quiz" && <Quiz onScore={(k, v) => best(k, v)} />}
        {view === "vf" && <VraiFaux onScore={(k, v) => best(k, v)} />}
        {view === "count" && <Comptage onScore={(k, v) => best(k, v)} />}
        {view === "texte" && <Textes onScore={(k, v) => best(k, v)} />}
        <footer className="mt-12 flex items-center justify-end">
          <button onClick={reset} className={`text-xs font-semibold ${T.faint} hover:opacity-70 underline underline-offset-4`}>Réinitialiser ma progression</button>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
